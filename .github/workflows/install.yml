name: Fresh server installation
on:
  push:
    branches: [main]
    paths: ['install.sh', 'deploy/**', 'cpp/**', 'static/**', 'scripts/**', 'app.py', '.github/workflows/install.yml']
  pull_request:
    paths: ['install.sh', 'deploy/**', 'cpp/**', 'static/**', 'scripts/**', 'app.py', '.github/workflows/install.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unit checks
        run: |
          bash -n install.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: Prepare disposable machine and trusted test certificate
        run: |
          # Only the disposable GitHub runner is modified by this test fixture.
          sudo systemctl disable --now nginx 2>/dev/null || true
          if dpkg-query -W nginx >/dev/null 2>&1; then sudo apt-get purge -y nginx nginx-common; fi
          sudo rm -rf /etc/nginx
          fixture=$(mktemp -d /var/tmp/xcli-cert.XXXXXXXX)
          chmod 755 "$fixture"
          printf 'FIXTURE=%s\n' "$fixture" >> "$GITHUB_ENV"
          public_ip=$(curl -q -4 -fsS --retry 3 --max-time 20 https://api.ipify.org)
          printf 'PUBLIC_IP=%s\n' "$public_ip" >> "$GITHUB_ENV"
          printf '%s panel.install.example\n' "$public_ip" | sudo tee -a /etc/hosts >/dev/null
          sudo ip addr add "$public_ip/32" dev lo
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3 -subj /CN=Xcli-Install-Test-CA \
            -keyout "$fixture/ca.key" -out "$fixture/ca.crt"
          openssl req -newkey rsa:2048 -nodes -sha256 -subj /CN=panel.install.example \
            -keyout "$fixture/server.key" -out "$fixture/server.csr"
          printf 'subjectAltName=DNS:panel.install.example\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' > "$fixture/extensions"
          openssl x509 -req -in "$fixture/server.csr" -CA "$fixture/ca.crt" -CAkey "$fixture/ca.key" \
            -CAcreateserial -days 3 -sha256 -extfile "$fixture/extensions" -out "$fixture/server.crt"
          sudo cp "$fixture/ca.crt" /usr/local/share/ca-certificates/xcli-install-test.crt
          sudo update-ca-certificates
      - name: Read-only preflight and full source installation
        run: |
          sudo python3 deploy/install.py --check --yes --domain panel.install.example --public-ip "$PUBLIC_IP"
          test ! -e /etc/xray-gateway
          # Push builds exercise the public download entry point and immutable archive.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            sudo bash install.sh --ref "$GITHUB_SHA" --yes --domain panel.install.example --public-ip "$PUBLIC_IP" \
              --certificate "$FIXTURE/server.crt" --private-key "$FIXTURE/server.key"
          else
            work=$(mktemp -d /var/tmp/xcli-source.XXXXXXXX)
            chmod 755 "$work"
            mkdir "$work/source"
            git archive HEAD | tar -x -C "$work/source"
            sudo python3 "$work/source/deploy/install.py" --yes --domain panel.install.example --public-ip "$PUBLIC_IP" \
              --certificate "$FIXTURE/server.crt" --private-key "$FIXTURE/server.key"
          fi
      - name: Verify login and safe repeat refusal
        run: sudo python3 deploy/tests/verify_install.py
      - name: Installation diagnostics on failure
        if: failure()
        run: |
          sudo systemctl --no-pager --full status nginx xray-gateway-core xray-gateway-panel xray-gateway-monitor || true
          sudo journalctl --no-pager -n 60 -u xray-gateway-core -u xray-gateway-panel -u xray-gateway-monitor || true
          sudo sh -c 'for file in /root/xcli-install-*/install.log; do test ! -f "$file" || tail -n 100 "$file"; done'
