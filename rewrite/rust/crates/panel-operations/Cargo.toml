[package]
name = "xcli-panel-operations"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "xcli-webhook-sender"
path = "src/bin/webhook_sender.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["net"] }
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
xcli-auth-compat = { path = "../auth-compat" }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.23"
