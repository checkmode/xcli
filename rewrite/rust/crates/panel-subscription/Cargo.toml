[package]
name = "xcli-panel-subscription"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xcli-auth-compat = { path = "../auth-compat" }
xcli-panel-users = { path = "../panel-users" }
xcli-panel-rules = { path = "../panel-rules" }
zeroize = "1.8"

[dev-dependencies]
aes-gcm = "0.10"
tempfile = "3.23"
